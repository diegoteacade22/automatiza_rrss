name: social_scheduler
description: "Social Scheduler - Plataforma inteligente de gestión de redes sociales con IA"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: 3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: 1.0.8
  
  # State Management
  provider: 6.1.5+1
  
  # Utilities
  intl: 0.20.2
  
  # HTTP & Storage
  http: 1.5.0
  shared_preferences: 2.5.3
  hive: 2.2.3
  hive_flutter: 1.1.0
  
  # URL Launcher
  url_launcher: 6.3.1
  
  # Image Picker (Web compatible)
  image_picker: 1.1.2
  
  # Permission Handler
  permission_handler: 11.3.1
  
  # File Picker (Web compatible)
  file_picker: 8.1.4
  
  # Charts (for analytics)
  fl_chart: 0.69.0
  
  # OAuth & Auth
  oauth2: 2.0.2
  
  # Crypto for secure tokens
  crypto: 3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true